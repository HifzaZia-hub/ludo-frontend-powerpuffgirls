# Runs our definition of done (CLAUDE.md §7) on every pull request and on main, so a broken change
# can't be merged because someone forgot to run the checks (NFR-SYS-13; our D4, risk R2).
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch replaces a run that is still going.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      # Starts its own mock server and app, then starts a game, rolls, moves and wins in the Chrome
      # that GitHub's Ubuntu machines come with (NFR-SYS-09).
      - name: Browser smoke test
        run: npm run e2e -- smoke
        timeout-minutes: 10
